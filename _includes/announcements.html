{% if site.data.announcements %}
  <section class="sidebar__announcements" aria-labelledby="sidebar-announcements-title">
    <h3 id="sidebar-announcements-title">Announcements</h3>
    <ul>
      {% for announcement in site.data.announcements %}
        <li>
          <span aria-hidden="true">🎉</span>
          {% if announcement.url %}
            <a href="{{ announcement.url | relative_url }}">{{ announcement.text }}</a>
          {% else %}
            {{ announcement.text }}
          {% endif %}
        </li>
      {% endfor %}
    </ul>
  </section>
{% endif %}
