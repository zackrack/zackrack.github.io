# =========================
# Zackary Rackauckas — Academic Pages config (Research Engineer oriented)
# Replace every REPLACE_ME value.
# =========================

# Basic Site Settings
locale                   : "en-US"
site_theme               : "contrast"  # crisp, modern, RE-friendly: default/air/sunrise/mint/dirt/contrast
title                    : "Zackary Rackauckas"
title_separator          : "-"
name                     : &name "Zackary Rackauckas"
description              : &description "Research engineer focused on speech, NLP, and multimodal RAG systems for conversational AI."
url                      : "https://zackrack.github.io/"   # e.g. "https://zackrack.github.io"
baseurl                  : ""                               # keep "" for user sites
repository               : "zackrack/zackrack.github.io" # e.g. "zackrack/zackrack.github.io"

# Optional (nice for SEO/social cards)
# teaser                  : "teaser.png"
breadcrumbs              : false
words_per_minute         : 180
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Site Author (sidebar)
author:
  avatar           : "profile2.png"
  name             : "Zackary Rackauckas"
  pronouns         :
  bio              : "GenAI research engineer (NLP + speech). I build adaptive conversational agents, multimodal RAG, and voice-enabled learning systems."
  location         : "Corona del Mar, California, USA"
  employer         : "Columbia Engineering"
  uri              :
  email            : "zcr2105@columbia.edu"             # from CV :contentReference[oaicite:2]{index=2}

  # Academic websites
  googlescholar    : "https://scholar.google.com/citations?user=nLFm9YIAAAAJhl=en"  # from CV :contentReference[oaicite:3]{index=3}
  arxiv            :
  orcid            : "https://orcid.org/0009-0005-0446-3365"   # e.g. "https://orcid.org/0000-0000-0000-0000"
  semantic         :
  ssrn             :
  zotero           :

  # Repositories & software
  github           : "zackrack"   # your GitHub username
  stackoverflow    :
  kaggle           :

  # Social
  linkedin         : "in/zackrack"   # e.g. "in/zackrack" (no full URL needed)
  twitter          :
  bluesky          :
  medium           :
  youtube          :

# Publication categories (more RE/ML practical)
publication_category:
  conference:
    title: "Conference & Workshop Papers"
  journal:
    title: "Journal Articles"
  abstract:
    title: "Extended Abstracts"
  preprint:
    title: "Preprints"

# Comments (disable)
comments:
  provider               : false

# Atom/RSS
atom_feed:
  hide                   : false
  path                   :

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing (optional)
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           :
social:
  type                   : Person
  name                   : "Zackary Rackauckas"
  links:
    - "https://scholar.google.com/citations?user=nLFm9YIAAAAJhl=en"  # :contentReference[oaicite:4]{index=4}
    - "https://www.linkedin.com/in/zackrack"                          # update

# Analytics (optional)
analytics:
  provider               : "false"
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections (keep, but we’ll emphasize portfolio/projects for RE)
collections:
  teaching:
    output: false
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: false
    permalink: /:collection/:path/
  talks:
    output: false
    permalink: /:collection/:path/

# Defaults (good as-is)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins (GitHub Pages-safe)
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
